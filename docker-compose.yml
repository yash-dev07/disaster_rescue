version: "3.9"

services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: floodrescue
      POSTGRES_PASSWORD: floodrescue
      POSTGRES_DB: floodrescue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tools/infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodrescue"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: floodrescue
      MINIO_ROOT_PASSWORD: floodrescue123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build: ./src/api
    environment:
      DATABASE_URL: postgresql+psycopg2://floodrescue:floodrescue@postgres:5432/floodrescue
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOODRESCUE_API_SRC: /app
    ports:
      - "8000:8000"
    volumes:
      - ./src/api:/app
      - ./tests:/tests:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./src/worker
    environment:
      DATABASE_URL: postgresql://floodrescue:floodrescue@postgres:5432/floodrescue
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./src/worker:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./src/frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
